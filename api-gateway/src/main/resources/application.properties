spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.routes[0].id=auth-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].id=kitchen-route
spring.cloud.gateway.routes[1].uri=lb://KITCHEN-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/kitchen/**
spring.cloud.gateway.routes[2].id=orders-route
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/orders/**
management.endpoints.web.exposure.include=health,info,gateway
